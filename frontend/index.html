<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landslide Prediction System</title>

    <!-- Google Font --->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <!-- Leaflet -->
    <link rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-mountain"></i>
            <h1>Landslide Prediction System</h1>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Left Side -->
        <div class="prediction-card">

            <h2>AI Risk Analysis</h2>
            <p>
                Enter environmental values to predict
                possible landslide risk using Machine Learning.
            </p>

            <!-- Input Box -->
            <div class="input-group">
                <label>
                    <i class="fa-solid fa-cloud-rain"></i>
                    Rainfall
                </label>

                <input
                    type="number"
                    id="rainfall"
                    placeholder="Enter Rainfall"
                >
            </div>

            <!-- Input Box -->
            <div class="input-group">
                <label>
                    <i class="fa-solid fa-mountain-city"></i>
                    Slope
                </label>

                <input
                    type="number"
                    id="slope"
                    placeholder="Enter Slope"
                >
            </div>

            <!-- Input Box -->
            <div class="input-group">
                <label>
                    <i class="fa-solid fa-water"></i>
                    Soil Moisture
                </label>

                <input
                    type="number"
                    id="soil"
                    placeholder="Enter Soil Moisture"
                >
            </div>

            <!-- Predict Button -->
            <button onclick="predictLandslide()">
                <i class="fa-solid fa-brain"></i>
                Predict Risk
            </button>

            <!-- Result -->
            <div class="result-box">
                <h2 id="result">Waiting for Prediction...</h2>
            </div>

        </div>

        <!-- Right Side Map -->
        <div class="map-card">

            <div class="map-header">
                <i class="fa-solid fa-map-location-dot"></i>
                <h2>Risk Map Visualization</h2>
            </div>

            <div id="map"></div>

        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>
            AI Powered Landslide Detection |
            Flask + ML + Leaflet.js + Twilio
        </p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="js/map.js"></script>
    <script src="js/prediction.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
